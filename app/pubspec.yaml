publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  permission_handler: ^12.0.3
  material_ui: ^1.11.1
  ffi: ^2.1.3
  file_picker: ^12.1.0
  archive: ^4.7.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
