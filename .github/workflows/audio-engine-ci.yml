name: Native Audio Engine CI

on:
  push:
    branches: [main]
    paths:
      - "native/audio_engine/**"
      - ".github/workflows/audio-engine-ci.yml"
  pull_request:
    paths:
      - "native/audio_engine/**"
      - ".github/workflows/audio-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test native audio engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check native library
        working-directory: native/audio_engine
        run: cargo check --all-targets
      - name: Run deterministic audio tests
        working-directory: native/audio_engine
        run: cargo test --all-targets
