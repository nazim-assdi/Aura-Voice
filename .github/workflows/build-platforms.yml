name: Build all platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-check:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare web project
        working-directory: app
        run: flutter create --platforms=web .
      - name: Resolve packages
        working-directory: app
        run: flutter pub get
      - name: Format Dart sources
        working-directory: app
        run: dart format lib test
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Widget tests
        working-directory: app
        run: flutter test

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install Rust Android targets and cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Prepare Android project and microphone permission
        working-directory: app
        run: |
          flutter create --platforms=android .
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if "android.permission.RECORD_AUDIO" not in source:
              source = source.replace("    <application", permission + "    <application", 1)
          manifest.write_text(source, encoding="utf-8")

          gradle_candidates = (
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          )
          gradle = next((candidate for candidate in gradle_candidates if candidate.exists()), None)
          if gradle is None:
              raise SystemExit("Could not find Android app Gradle build file")
          gradle_source = gradle.read_text(encoding="utf-8")
          replacements = (
              ("compileSdk = flutter.compileSdkVersion", "compileSdk = 36"),
              ("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36"),
              ("minSdk = flutter.minSdkVersion", "minSdk = 26"),
              ("minSdkVersion flutter.minSdkVersion", "minSdkVersion 26"),
          )
          for old, new in replacements:
              if old in gradle_source:
                  gradle_source = gradle_source.replace(old, new, 1)
          if "compileSdk = 36" not in gradle_source and "compileSdkVersion 36" not in gradle_source:
              raise SystemExit("Could not configure compileSdk 37 in " + str(gradle))
          if "minSdk = 26" not in gradle_source and "minSdkVersion 26" not in gradle_source:
              raise SystemExit("Could not configure minSdk 26 in " + str(gradle))
          gradle.write_text(gradle_source, encoding="utf-8")
          PY
          mkdir -p android/app/src/main/jniLibs
      - name: Build Android native audio engine
        working-directory: native/audio_engine
        run: |
          cargo ndk -P 26 -t armeabi-v7a -t arm64-v8a -t x86_64 -o ../../app/android/app/src/main/jniLibs build --release
          test -f ../../app/android/app/src/main/jniLibs/arm64-v8a/libaura_audio_engine.so
      - name: Build release artifacts
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: aura-voice-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web
        working-directory: app
        run: |
          flutter create --platforms=web .
          flutter pub get
          flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: aura-voice-web
          path: app/build/web/

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Linux
        working-directory: app
        run: |
          flutter create --platforms=linux .
          flutter pub get
          flutter build linux --release
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build and bundle native audio engine
        run: |
          cargo build --manifest-path native/audio_engine/Cargo.toml --release
          cp native/audio_engine/target/release/libaura_audio_engine.so app/build/linux/x64/release/bundle/
      - name: Package Linux bundle
        run: |
          cd app/build/linux/x64/release/bundle
          tar -czf ../../../../../../aura-voice-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: aura-voice-linux-x64
          path: aura-voice-linux-x64.tar.gz

  windows:
    name: Windows desktop + automatic installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows app
        working-directory: app
        run: |
          flutter create --platforms=windows .
          flutter pub get
          flutter build windows --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Build self-contained AI backend executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          $pyiRoot = Join-Path $env:RUNNER_TEMP "aura-pyinstaller"
          New-Item -ItemType Directory -Force "$pyiRoot\dist", "$pyiRoot\build", "$pyiRoot\spec" | Out-Null
          Push-Location backend
          python -m PyInstaller --clean --noconfirm --onefile --noconsole --name aura-ai-server --distpath "$pyiRoot\dist" --workpath "$pyiRoot\build" --specpath "$pyiRoot\spec" --collect-all edge_tts --collect-all uvicorn --collect-all fastapi --collect-all pydantic_settings --collect-all certifi launcher.py
          Pop-Location
          New-Item -ItemType Directory -Force dist\backend | Out-Null
          Copy-Item "$pyiRoot\dist\aura-ai-server.exe" dist\backend\aura-ai-server.exe
      - name: Smoke test bundled AI backend
        shell: pwsh
        run: |
          $serverPath = (Resolve-Path "dist\backend\aura-ai-server.exe").Path
          $server = Start-Process -FilePath $serverPath -PassThru -WindowStyle Hidden
          $healthy = $false
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($server.HasExited) { throw "Bundled AI server exited with code $($server.ExitCode)" }
              try {
                $healthJson = & curl.exe --noproxy "*" --connect-timeout 1 --max-time 2 --silent --show-error "http://127.0.0.1:8000/health" 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $response = $healthJson | ConvertFrom-Json
                  if ($response.ok -eq $true -and $response.service -eq "aura-voice-api") {
                    $healthy = $true
                    break
                  }
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) { throw "Bundled AI backend did not become healthy within 30 seconds." }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build and bundle native audio engine
        shell: pwsh
        run: |
          cargo build --manifest-path native/audio_engine/Cargo.toml --release
          $release = "app/build/windows/x64/runner/Release"
          Copy-Item native/audio_engine/target/release/aura_audio_engine.dll "$release\aura_audio_engine.dll"
          Copy-Item dist/backend/aura-ai-server.exe "$release\aura-ai-server.exe"
          Copy-Item Start-Aura-AI.bat "$release\Start-Aura-AI.bat" -Force
      - name: Download Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\prerequisites | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dist\prerequisites\vc_redist.x64.exe"
          if ((Get-Item "dist\prerequisites\vc_redist.x64.exe").Length -lt 1000000) {
            throw "The Microsoft Visual C++ runtime download is incomplete."
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows Setup.exe
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not installed." }
          $versionLine = Select-String -Path "app\pubspec.yaml" -Pattern '^version:\s*(.+)$'
          $version = $versionLine.Matches[0].Groups[1].Value.Split('+')[0]
          & $compiler "/DAppVersion=$version" "packaging\windows\Aura-Voice-Studio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
      - name: Test silent install and automatic prerequisites
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\installer\Aura-Voice-Studio-Setup-x64.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP "Aura Voice Installer Test"
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $installRoot + '"'
          $install = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installation failed with exit code $($install.ExitCode)." }
          $vcRuntime = Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64" -ErrorAction SilentlyContinue
          if ($null -eq $vcRuntime -or $vcRuntime.Installed -ne 1) { throw "Microsoft Visual C++ x64 runtime was not installed." }
          foreach ($required in @("aura_voice_ai.exe", "aura_audio_engine.dll", "aura-ai-server.exe", "_prerequisites\vc_redist.x64.exe", "Start-Aura-AI.bat")) {
            if (-not (Test-Path (Join-Path $installRoot $required))) { throw "Installer did not install $required." }
          }
          $server = Start-Process -FilePath (Join-Path $installRoot "aura-ai-server.exe") -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($server.HasExited) { throw "Installed AI server exited with code $($server.ExitCode)." }
              try {
                $healthJson = & curl.exe --noproxy "*" --connect-timeout 1 --max-time 2 --silent --show-error "http://127.0.0.1:8000/health" 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $response = $healthJson | ConvertFrom-Json
                  if ($response.ok -eq $true) { $healthy = $true; break }
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) { throw "The AI server did not start from the installed application folder." }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          }
      - name: Create portable Windows ZIP
        shell: pwsh
        run: |
          $release = "app/build/windows/x64/runner/Release"
          Copy-Item "Start-Aura-AI.bat" "$release\Start-Aura-AI.bat" -Force
          Compress-Archive -Path "$release\*" -DestinationPath "dist\Aura-Voice-Studio-Windows-x64-Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: aura-voice-windows-installer
          path: dist/installer/Aura-Voice-Studio-Setup-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aura-voice-windows-portable
          path: dist/Aura-Voice-Studio-Windows-x64-Portable.zip
          if-no-files-found: error

  apple:
    name: macOS and iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install stable Rust and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Prepare Apple projects and microphone permissions
        working-directory: app
        run: |
          flutter create --platforms=macos,ios .
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' macos/Runner/Info.plist >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string "Aura Voice Studio uses microphone access for live voice input and recording."' macos/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' ios/Runner/Info.plist >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string "Aura Voice Studio uses microphone access for recording and live monitoring."' ios/Runner/Info.plist
      - name: Build and link iOS native audio engine
        run: |
          cargo build --manifest-path native/audio_engine/Cargo.toml --target aarch64-apple-ios --release
          test -f native/audio_engine/target/aarch64-apple-ios/release/libaura_audio_engine.a
          cp native/audio_engine/target/aarch64-apple-ios/release/libaura_audio_engine.a app/ios/Runner/
          python - <<'PY'
          from pathlib import Path
          import re
          project = Path("app/ios/Runner.xcodeproj/project.pbxproj")
          source = project.read_text(encoding="utf-8")
          setting = 'OTHER_LDFLAGS = "$(inherited) -force_load $(SRCROOT)/Runner/libaura_audio_engine.a";'
          if setting not in source:
              source, count = re.subn(
                  r'(PRODUCT_BUNDLE_IDENTIFIER = [^;]+;)',
                  lambda match: setting + "\n\t\t\t\t" + match.group(1),
                  source,
              )
              if count < 3:
                  raise SystemExit("Expected three Runner build configurations; found " + str(count))
          if source.count("-force_load $(SRCROOT)/Runner/libaura_audio_engine.a") < 3:
              raise SystemExit("iOS native archive was not linked in all Runner configurations")
          project.write_text(source, encoding="utf-8")
          PY
      - name: Build Apple targets
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
          flutter build ios --release --no-codesign
          test -f build/ios/iphoneos/Runner.app/Runner
      - name: Build and bundle native audio engine in macOS app
        run: |
          cargo build --manifest-path native/audio_engine/Cargo.toml --release
          cp native/audio_engine/target/release/libaura_audio_engine.dylib app/build/macos/Build/Products/Release/aura_voice_ai.app/Contents/MacOS/
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent app/build/macos/Build/Products/Release/aura_voice_ai.app aura-voice-macos.zip
      - name: Package unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent app/build/ios/iphoneos/Runner.app aura-voice-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aura-voice-apple
          path: |
            aura-voice-macos.zip
            aura-voice-ios-unsigned.zip
