[package]
name = "aura-audio-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic PCM audio session renderer for Aura Voice Studio"
license = "MIT"

[lib]
name = "aura_audio_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
cpal = "0.18.2"

[profile.release]
lto = true
codegen-units = 1
